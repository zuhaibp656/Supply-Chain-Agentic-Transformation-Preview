<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persona &amp; Agent Suite — Agentic Supply Chain Transformation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/aurora.css">
<link rel="stylesheet" href="../assets/deck_nav.css?v=2">
<script src="../assets/deck_nav.js?v=15"></script>
<script src="../data/supply_chain_data.js?v=14"></script>
<script src="../data/live_agents_registry.js?v=1"></script>
<script src="../data/persona_and_agent_details.js?v=1"></script>
<style>
  :root {
    --accent: var(--g-blue); --accent-soft: rgba(49,134,255,.11);
    --wrap: 1420px; --font: var(--font-display); --mono: var(--font-mono);
  }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 max(20px, 2.8vw); }

  .roster { position: relative; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--border-subtle); padding: 12px 0 10px; }
  .domain-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border-subtle); background: var(--surface); color: var(--text-muted); cursor: pointer; font: 600 12px var(--font); transition: all .15s; }
  .fchip.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--blue-ink); }
  .fsearch { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-subtle); background: var(--surface); color: var(--text); font: 400 12px var(--font); min-width: 210px; }
  .strip { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .pchip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 1px solid var(--border-subtle); background: var(--surface); color: var(--text); cursor: pointer; font: 600 12px var(--font); transition: transform .15s, border-color .15s; }
  .pchip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .pchip.is-on { border-color: var(--accent); background: var(--accent-soft); }
  .pchip-av { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 10px var(--font); color: #fff; }
  .pchip-sub { font-weight: 400; font-size: 11px; color: var(--text-muted); }

  .genie-stage { padding: 24px 0 72px; }
  .hero-card {
    position: relative; overflow: hidden; border-radius: 24px; padding: 26px 28px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--pc, #3186FF) 12%, var(--surface)) 0%, var(--surface) 58%, color-mix(in srgb, #4B31E3 8%, var(--surface)) 100%);
    border: 1.5px solid color-mix(in srgb, var(--pc, #3186FF) 32%, var(--border-subtle));
    box-shadow: var(--shadow-md);
    display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
  }
  .hero-card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
    background: linear-gradient(90deg, #3186FF 0%, #4B31E3 35%, #00AF57 70%, #FEC700 100%);
  }
  @media (max-width: 880px) { .hero-card { grid-template-columns: 1fr; } }
  .hero-left { display: flex; gap: 20px; align-items: flex-start; }
  @media (max-width: 600px) { .hero-left { flex-direction: column; } }
  .portrait-badge {
    width: 74px; height: 74px; border-radius: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font: 700 24px var(--font); color: #fff; background: var(--pc, #3186FF);
    box-shadow: 0 12px 26px color-mix(in srgb, var(--pc, #3186FF) 36%, transparent);
  }
  .meta-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
  .mpill { font: 700 10.5px var(--mono); padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border-subtle); color: var(--text-muted); }
  .role-h1 { font-size: clamp(24px, 2.6vw, 34px); font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; line-height: 1.12; color: var(--text); }
  .human-sub { font-size: 15px; font-weight: 600; color: var(--pc, #3186FF); margin: 0 0 10px; }
  .human-sub span { color: var(--text-muted); font-weight: 500; }
  .what-desc { font-size: 14.5px; line-height: 1.56; color: var(--text); margin: 0 0 12px; max-width: 72ch; }
  .sys-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .sys-chip { font: 600 11px var(--mono); padding: 4px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border-subtle); color: var(--text); }

  .kpi-stack { display: flex; gap: 12px; flex-wrap: wrap; }
  .kpi-box {
    min-width: 132px; padding: 14px 18px; border-radius: 18px; text-align: center;
    background: var(--surface); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
  }
  .kpi-box b { display: block; font-size: 21px; font-weight: 700; line-height: 1.15; margin-bottom: 2px; color: var(--text); }
  .kpi-box span { font: 700 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }

  .flow-bar {
    margin-top: 18px; display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 12px; align-items: center;
    padding: 16px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
  }
  @media (max-width: 820px) { .flow-bar { grid-template-columns: 1fr; } .flow-arr { display: none; } }
  .flow-step { display: flex; align-items: center; gap: 12px; }
  .flow-num { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font: 700 12px var(--mono); color: #fff; background: var(--pc, #3186FF); }
  .flow-step b { display: block; font-size: 13.5px; color: var(--text); }
  .flow-step span { font-size: 12px; color: var(--text-muted); }
  .flow-arr { font: 700 16px var(--mono); color: var(--pc, #3186FF); letter-spacing: 3px; }

  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 14px; gap: 12px; flex-wrap: wrap; }
  .sec-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.015em; color: var(--text); }

  .suite-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
  .ag-card {
    --ac: #3186FF;
    position: relative; border-radius: 20px; padding: 20px; text-decoration: none; color: inherit;
    background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 8%, var(--surface)) 0%, var(--surface) 44%);
    border: 1.5px solid color-mix(in srgb, var(--ac) 28%, var(--border-subtle));
    box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 12px;
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s, border-color .22s;
    cursor: pointer;
  }
  .ag-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--ac); }
  .ag-card::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 4px; border-radius: 0 0 4px 4px; background: var(--ac); }

  .ag-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .ag-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill { font: 700 10px var(--mono); padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border-subtle); color: var(--text-muted); }
  .pill.p0 { background: rgba(252,65,61,.12); border-color: rgba(252,65,61,.3); color: #C62A27; }
  .pill.p1 { background: rgba(254,199,0,.22); border-color: rgba(254,199,0,.45); color: #8A6200; }
  .plive {
    display: inline-flex; align-items: center; gap: 5px;
    font: 700 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
    color: #FFF; background: var(--g-green); border-radius: 999px; padding: 4px 8px;
    box-shadow: 0 0 0 3px rgba(0, 175, 87, .16);
  }
  .plive::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #FFF; animation: livePulse 1.6s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.9); } 50% { box-shadow: 0 0 0 4px rgba(255,255,255,0); } }

  .ag-name { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.25; color: var(--text); }
  .ag-desc {
    font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.48;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .ag-icon-wrap {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--ac) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--ac) 26%, transparent);
  }
  .ag-icon-wrap img { width: 20px; height: 20px; display: block; }
  .ag-foot { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font: 700 12.5px var(--font); color: var(--ac); }
  .ag-btn-details { color: var(--ac); text-decoration: none; font: 700 12.5px var(--font); }
  .ag-btn-details:hover { text-decoration: underline; }
  .ag-btn-ge {
    display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
    padding: 6px 12px; border-radius: 999px; font: 700 11.5px var(--font);
    background: linear-gradient(135deg, #3186FF 0%, #4B31E3 100%); color: #fff;
    box-shadow: 0 4px 12px rgba(49,134,255,.22); transition: transform .15s;
  }
  .ag-btn-ge:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<header class="mast">
  <a href="../index.html" style="display:flex;align-items:center;gap:12px;">
    <img src="../assets/media/wip/image25.png" alt="Google Cloud">
    <span class="mast-rule"></span>
    <span class="mast-tag">Persona Dossier &amp; Agent Suite</span>
  </a>
  <span class="mast-sp"></span>
  <div class="mast-nav" id="mastSlideNav">
    <button class="btn-ghost" id="themeToggle" type="button">Dark</button>
    <a class="btn-ghost" href="persona_map.html">← Persona Matrix</a>
  </div>
</header>

<section class="roster">
  <div class="wrap">
    <div class="domain-row" id="domainChips"></div>
    <div class="strip" id="personaStrip"></div>
  </div>
</section>

<main class="wrap genie-stage" id="dossierRoot"></main>

<script>
  initDeckChrome({ root: '../', prev: 'persona_map.html', next: 'build_01_how.html' });

  (function () {
    var PILLARS = window.SUPPLY_CHAIN_DATA.pillars || [];
    var PDETAILS = window.SC_PERSONA_DETAILS || {};
    var ADETAILS = window.SC_AGENT_DETAILS || {};
    var ACCENTS = ['#3186FF', '#4B31E3', '#00AF57', '#0A7684', '#E65100', '#C62828'];

    var allIds = Object.keys(PDETAILS);
    var activeDomain = 'all';
    var searchQ = '';
    var qs = new URLSearchParams(location.search);
    var reqId = qs.get('id') || qs.get('persona') || allIds[0] || 'SC-01';
    if (!PDETAILS[reqId]) reqId = allIds[0];

    function initials(name) {
      return (name || 'SC').split(/[\s\/]+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('');
    }
    function toList(v) {
      if (Array.isArray(v)) return v;
      if (typeof v === 'string') return v.split(/\s*[·|]\s*/).map(function (s) { return s.trim(); }).filter(Boolean);
      return [];
    }

    function paintRoster() {
      var dEl = document.getElementById('domainChips');
      dEl.innerHTML =
        '<button class="fchip ' + (activeDomain === 'all' ? 'is-on' : '') + '" data-d="all">All 60 Roles</button>' +
        PILLARS.map(function (p) {
          return '<button class="fchip ' + (activeDomain === p.id ? 'is-on' : '') + '" data-d="' + p.id + '">' + p.num + ' · ' + p.title + '</button>';
        }).join('') +
        '<input class="fsearch" id="pSearch" type="search" placeholder="Filter persona or agent..." value="' + searchQ.replace(/"/g, '&quot;') + '">';

      dEl.querySelectorAll('.fchip').forEach(function (b) {
        b.addEventListener('click', function () { activeDomain = b.dataset.d; paintRoster(); });
      });
      var sBox = document.getElementById('pSearch');
      sBox.addEventListener('input', function () { searchQ = sBox.value; paintStrip(); });
      paintStrip();
    }

    function paintStrip() {
      var q = searchQ.trim().toLowerCase();
      var list = allIds.map(function (id) { return PDETAILS[id]; }).filter(function (p) {
        if (activeDomain !== 'all' && p.pillarId !== activeDomain) return false;
        if (!q) return true;
        return (p.id + ' ' + p.persona + ' ' + p.suiteNames.join(' ')).toLowerCase().indexOf(q) !== -1;
      });
      var sEl = document.getElementById('personaStrip');
      sEl.innerHTML = list.map(function (p) {
        return '<button class="pchip ' + (p.id === reqId ? 'is-on' : '') + '" data-id="' + p.id + '">' +
          '<span class="pchip-av" style="background:' + (p.pillarColor || '#3186FF') + '">' + initials(p.persona) + '</span>' +
          '<span>' + p.persona + '</span>' +
          '<span class="pchip-sub">· ' + p.id + '</span>' +
        '</button>';
      }).join('');
      sEl.querySelectorAll('.pchip').forEach(function (b) {
        b.addEventListener('click', function () {
          reqId = b.dataset.id;
          history.replaceState(null, '', '?id=' + encodeURIComponent(reqId));
          paintStrip();
          paintDossier();
        });
      });
    }

    function paintDossier() {
      var p = PDETAILS[reqId];
      if (!p) return;
      var root = document.getElementById('dossierRoot');
      var ICONS = [
        '../assets/media/models/gemini-color.svg',
        '../assets/media/gcp/Agents.svg',
        '../assets/media/gcp/VertexAI.svg',
        '../assets/media/gcp/BigQuery.svg',
        '../assets/media/gcp/IntegrationServices.svg',
        '../assets/media/gcp/Observability.svg'
      ];
      var cardsHtml = (p.suiteNames || []).map(function (aname, idx) {
        var a = ADETAILS[aname.toLowerCase()] || {};
        var ac = ACCENTS[idx % ACCENTS.length];
        var iconSrc = ICONS[idx % ICONS.length];
        var isLive = Boolean(a.liveInGE);
        var pCls = (a.priority || '').indexOf('P0') === 0 ? 'p0' : 'p1';
        var href = 'agent_details.html?agent=' + encodeURIComponent(aname) + '&persona=' + encodeURIComponent(p.id);
        var oneLine = (a.sumanImpact || a.outcome || a.does || '').split(/\.(\s|$)/)[0].trim();
        if (oneLine && !/[.!?]$/.test(oneLine)) oneLine += '.';
        return '<div class="ag-card" style="--ac:' + ac + ';" onclick="window.location.href=\'' + href.replace(/'/g, "\\'") + '\'">' +
          '<div class="ag-top">' +
            '<div style="display:flex;align-items:center;gap:10px;">' +
              '<span class="ag-icon-wrap"><img src="' + iconSrc + '" alt=""></span>' +
              '<div class="ag-badges">' +
                '<span class="pill ' + pCls + '">' + (a.priority || 'P1 · Build Next') + '</span>' +
                (isLive ? '<span class="plive">Live</span>' : '') +
              '</div>' +
            '</div>' +
          '</div>' +
          '<h3 class="ag-name">' + (a.geDisplayName || aname) + '</h3>' +
          '<p class="ag-desc">' + oneLine + '</p>' +
          '<div class="ag-foot">' +
            '<a class="ag-btn-details" href="' + href + '" onclick="event.stopPropagation();">View Details &rarr;</a>' +
            (isLive && a.geUrl ? '<a class="ag-btn-ge" href="' + a.geUrl + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">Open in GE &#8599;</a>' : '') +
          '</div>' +
        '</div>';
      }).join('');

      root.innerHTML =
        '<section class="hero-card" style="--pc:' + (p.pillarColor || '#3186FF') + ';">' +
          '<div class="hero-left">' +
            '<div class="portrait-badge">' + initials(p.persona) + '</div>' +
            '<div>' +
              '<div class="meta-pills">' +
                '<span class="mpill">' + p.id + ' · Pillar ' + p.pillarNum + ' · ' + p.pillarTitle + '</span>' +
                '<span class="mpill">' + p.subprocess + '</span>' +
              '</div>' +
              '<h1 class="role-h1">' + p.persona + '</h1>' +
              '<div class="human-sub"><span>' + p.setting + '</span></div>' +
              '<p class="what-desc">' + p.whatTheyDo + '</p>' +
              '<div class="sys-chips">' + toList(p.systemsTouched).map(function (s) { return '<span class="sys-chip">⚡ ' + s + '</span>'; }).join('') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="kpi-stack">' +
            '<div class="kpi-box"><b style="color:var(--green-ink);font-size:16px;">' + (p.sumanImpact || p.setting) + '</b><span>Target Impact</span></div>' +
            '<div class="kpi-box"><b>' + p.toilBefore + 'h → ' + p.toilAfter + 'h</b><span>Weekly Toil</span></div>' +
            '<div class="kpi-box"><b>' + p.suiteNames.length + ' Agents</b><span>Agentic Suite</span></div>' +
          '</div>' +
        '</section>' +
        '<div class="flow-bar" style="--pc:' + (p.pillarColor || '#3186FF') + ';">' +
          '<div class="flow-step"><div class="flow-num">01</div><div><b>Live Signals</b><span>' + toList(p.systemsTouched).slice(0, 3).join(' · ') + '</span></div></div>' +
          '<div class="flow-arr">···</div>' +
          '<div class="flow-step"><div class="flow-num">02</div><div><b>' + p.suiteNames.length + ' Specialized Agents Coordinate</b><span>Sense exceptions, run deterministic math &amp; prepare drafts</span></div></div>' +
          '<div class="flow-arr">···</div>' +
          '<div class="flow-step"><div class="flow-num">03</div><div><b>' + p.persona + ' Approves in 1 Click</b><span>' + p.notOwned + '</span></div></div>' +
        '</div>' +
        '<div class="sec-head"><h2 style="display:flex;align-items:center;gap:8px;"><img src="../assets/media/models/gemini-color.svg" alt="" style="width:18px;height:18px;"><span>Agentic Suite (' + p.suiteNames.length + ' Agents)</span></h2><span style="font:600 12px var(--mono);color:var(--text-muted);">Click any agent card to open full architecture &amp; live links</span></div>' +
        '<div class="suite-grid">' + cardsHtml + '</div>' +
        '<footer class="deck-footer" style="margin-top:32px;"><span>Persona Dossier &amp; Agent Suite</span><span class="footer-brand"><img src="../assets/media/wip/image25.png" alt="Google Cloud"><span style="width:1px;height:16px;background:#DADCE0;"></span><img src="../assets/media/gemini_enterprise_logo.svg" alt="Gemini Enterprise"></span></footer>';
    }

    paintRoster();
    paintDossier();
  })();
</script>
</body>
</html>
